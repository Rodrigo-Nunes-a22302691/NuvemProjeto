---
- name: Deploy hello-world container
  hosts: ec2
  become: true

  tasks:
    - name: Install Docker
      dnf:
        name: docker
        state: present

    - name: Start and enable Docker service
      service:
        name: docker
        state: started
        enabled: true

    - name: Add ec2-user to docker group
      user:
        name: ec2-user
        groups: docker
        append: true

    - name: Pull hello-world image
      community.docker.docker_image:
        name: "{{ dockerhub_username }}/hello-world"
        tag: latest
        source: pull

    - name: Run hello-world container
      community.docker.docker_container:
        name: hello-world
        image: "{{ dockerhub_username }}/hello-world:latest"
        state: started
        restart_policy: always
        ports:
          - "80:80"