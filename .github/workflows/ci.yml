name: CI — Build & Push & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: eu-west-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push hello-world image
        uses: docker/build-push-action@v5
        with:
          context: ./services/hello-world
          push: true
          no-cache: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/hello-world:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          pip install ansible
          ansible-galaxy collection install community.docker

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key.pem
          chmod 400 ~/.ssh/deploy_key.pem

      - name: Update inventory with EC2 IP
        run: |
          sed -i 's/ansible_host: .*/ansible_host: 3.248.189.212/' ansible/inventory/hosts.yml
          sed -i 's|ansible_ssh_private_key_file: .*|ansible_ssh_private_key_file: ~/.ssh/deploy_key.pem|' ansible/inventory/hosts.yml

      - name: Run Ansible playbook
        run: |
          ansible-playbook -i ansible/inventory/hosts.yml ansible/playbooks/deploy.yml \
            -e "dockerhub_username=${{ secrets.DOCKERHUB_USERNAME }}"