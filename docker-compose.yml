version: '3.8'

services:
  user-service:
    image: ${DOCKERHUB_USERNAME}/user-service:latest
    ports:
      - "8081:8081"
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${DB_HOST}:5432/microservices
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
    networks:
      - microservices-network

  product-service:
    image: ${DOCKERHUB_USERNAME}/product-service:latest
    ports:
      - "8082:8082"
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${DB_HOST}:5432/microservices
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
      - CLOUD_SQS_PRODUCT_EVENTS_ENABLED=true
      - CLOUD_SQS_PRODUCT_EVENTS_QUEUE_URL=${SQS_QUEUE_URL}
      - CLOUD_SQS_PRODUCT_EVENTS_REGION=eu-west-1
    networks:
      - microservices-network

  order-service:
    image: ${DOCKERHUB_USERNAME}/order-service:latest
    ports:
      - "8083:8083"
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${DB_HOST}:5432/microservices
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
      - SERVICES_USER_URL=http://user-service:8081
      - SERVICES_PRODUCT_URL=http://product-service:8082
      - CLOUD_SQS_PRODUCT_EVENTS_CONSUMER_ENABLED=true
      - CLOUD_SQS_PRODUCT_EVENTS_CONSUMER_QUEUE_URL=${SQS_QUEUE_URL}
      - CLOUD_SQS_PRODUCT_EVENTS_CONSUMER_REGION=eu-west-1
    networks:
      - microservices-network

  api-gateway:
    image: ${DOCKERHUB_USERNAME}/api-gateway:latest
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      - user-service
      - product-service
      - order-service
    networks:
      - microservices-network

networks:
  microservices-network:
    driver: bridge